<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; font-src 'none'; media-src 'none'; form-action 'none'; base-uri 'none'; frame-src 'self'; object-src 'none'; worker-src 'none'"
    >
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes">
    <title>Diagram preview</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
        background: #ffffff;
      }

      :root[data-theme="dark"] {
        background: #111318;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
        overscroll-behavior: contain;
      }

      body {
        box-sizing: border-box;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 16px;
        background: inherit;
      }

      #diagram {
        box-sizing: border-box;
        width: 100%;
        min-width: 0;
        overflow: visible;
      }

      #diagram svg {
        display: block;
        width: 100%;
        max-width: 100%;
        height: auto;
        margin: 0 auto;
      }

      #diagram img {
        display: block;
        width: 100%;
        max-width: 100%;
        height: auto;
        margin: 0 auto;
        object-fit: contain;
      }

      #diagram iframe {
        display: block;
        box-sizing: border-box;
        width: 100%;
        min-height: calc(100vh - 32px);
        border: 0;
        background: #ffffff;
      }

      #status {
        box-sizing: border-box;
        width: min(100%, 42rem);
        margin: 24px auto;
        padding: 16px;
        border: 1px solid #d7dbe2;
        border-radius: 12px;
        color: #272b33;
        background: #f5f6f8;
        font-size: 15px;
        line-height: 1.45;
        white-space: pre-wrap;
      }

      :root[data-theme="dark"] #status {
        border-color: #3a404b;
        color: #edf0f5;
        background: #1b1f27;
      }

      [hidden] {
        display: none !important;
      }
    </style>
    <script defer src="mermaid.min.js"></script>
    <script defer src="app.js"></script>
  </head>
  <body>
    <main id="diagram" aria-label="Diagram preview"></main>
    <p id="status" role="alert" hidden></p>
  </body>
</html>
